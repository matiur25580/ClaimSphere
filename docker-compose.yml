services:
  mongodb:
    image: mongo:8
    container_name: claimsphere-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - claimsphere-mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  claimsphere-mongodb-data:
