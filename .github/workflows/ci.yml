name: CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main, "feat/**"]
permissions:
  contents: read
jobs:
  validate:
    name: Validate workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Build
        run: npm run build
